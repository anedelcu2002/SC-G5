# --8<-- [start:config]
config:
  init:
    name: Delft model
    # What version of Calliope this model is intended for
    calliope_version: 0.7.0
    broadcast_input_data: true  # allow single indexed parameter data entries to be broadcast across all index items, if there are multiple entries.
    mode: base # Choices: base, operate, spores

  build:
    ensure_feasibility: true # Switching on unmet demand

  solve:
    solver: gurobi
# --8<-- [end:config]

# --8<-- [start:parameter_data_definitions]
data_definitions:
  objective_cost_weights:
    data: 1
    index: monetary
    dims: costs
  cost_interest_rate:
    data: 1
    index: monetary
    dims: costs
  # `bigM` sets the scale of unmet demand, which cannot be too high, otherwise the optimisation will not converge
  bigM: 1
# --8<-- [end:parameter_data_definitions]

techs:
  supply_electricity:
    name: National grid import
    color: '#C5ABE3'
    base_tech: supply
    carrier_out: electricity
    cost_flow_cap:
      data: 1000
      index: monetary
      dims: costs
    flow_cap_max: 2000
    lifetime: 20

  supply_geothermal:
    name: Geothermal heat extraction
    color: '#C98AAD'
    base_tech: supply
    carrier_out: heat
    flow_cap_max: 2000
    cost_flow_cap:
      data: 1000
      index: monetary
      dims: costs
    lifetime: 20

  heat_pump:
    name: Air-to-air heat pump
    color: '#8E2999'
    base_tech: conversion
    carrier_in: electricity
    carrier_out: heat
    cost_flow_cap:
      data: 5
      index: [[monetary, heat]]
      dims: [costs, carriers]
    flow_cap_max:
      data: 50
      index: heat
      dims: carriers
    flow_out_eff: 0.95
    lifetime: 20

  demand_electricity:
    name: Electrical demand
    color: '#072486'
    base_tech: demand
    carrier_in: electricity

  demand_heat:
    name: Heat demand
    color: '#660507'
    base_tech: demand
    carrier_in: heat

# --8<-- [start:data-tables]


data_tables:
  links_costs_monetary:
    data: data_tables/links_costs.csv
    rows: techs
    columns: parameters
    add_dims:
      costs: monetary
  links_electricity:
    data: data_tables/links_electricity.csv
    rows: techs
    columns: parameters
    add_dims:
      carriers: electricity
  links_heat:
    data: data_tables/links_heat.csv
    rows: techs
    columns: parameters
    add_dims:
      carriers: heat
  links:
    data: data_tables/links.csv
    rows: techs
    columns: parameters
  nodes:
    data: data_tables/nodes.csv
    rows: [nodes, techs, parameters]
    columns: timesteps
  nodes_base_info:
    data: data_tables/nodes_base_info.csv
    rows: nodes
    columns: parameters
