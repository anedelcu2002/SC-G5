# --8<-- [start:import]
import: # Import other files from paths relative to this file, or absolute paths
  - "model_config/techs.yaml"
  - "scenarios.yaml"
# --8<-- [end:import]

# --8<-- [start:config]
config:
  init:
    name: Delft model
    # What version of Calliope this model is intended for
    calliope_version: 0.7.0
    broadcast_input_data: true  # allow single indexed parameter data entries to be broadcast across all index items, if there are multiple entries.
    mode: base # Choices: base, operate, spores

  build:
    ensure_feasibility: true # Switching on unmet demand

  solve:
    solver: gurobi
# --8<-- [end:config]

# --8<-- [start:parameter_data_definitions]
data_definitions:
  objective_cost_weights:
    data: 1
    index: monetary
    dims: costs
  # `bigM` sets the scale of unmet demand, which cannot be too high, otherwise the optimisation will not converge
  bigM: 1e6
# --8<-- [end:parameter_data_definitions]

# --8<-- [start:data-tables]


data_tables:
  nodes:
    data: data_tables/nodes.csv
    rows: [nodes, techs, parameters]
    columns: timesteps
  locations:
    data: data_tables/locations.csv
    rows: nodes
    columns: parameters
  links:
    data: data_tables/links.csv
    rows: techs
    columns: parameters
  links_base_tech:
    data: data_tables/links_base_tech.csv
    rows: techs
    columns: parameters
  links_properties:
    data: data_tables/links_properties.csv
    rows: techs
    columns: parameters
  links_heat:
    data: data_tables/links_heat.csv
    rows: techs
    columns: parameters
    add_dims:
      carriers: heat
  links_electricity:
    data: data_tables/links_electricity.csv
    rows: techs
    columns: parameters
    add_dims:
      carriers: electricity
# --8<-- [end:data-tables]
